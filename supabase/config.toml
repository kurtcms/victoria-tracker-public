project_id = "victoria-tracker"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "com.victoriatracker.app://auth/confirm"
additional_redirect_urls = ["com.victoriatracker.app://auth/confirm"]
enable_signup = true
minimum_password_length = 12

[auth.email]
# CLI maps this to the whole email provider, including existing-account login.
# Keep true even when [auth].enable_signup is false on the hosted project.
enable_signup = true
enable_confirmations = true

[functions.record-event]
# Gateway defense in depth. The handler MUST still verify a real signed-in user
# through Auth /user: gateway API-key compatibility is not user authentication.
verify_jwt = true


[functions.care-command]
verify_jwt = true
